<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bravo | Водії</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo">
            <span class="logo-dot"></span>
            <h2>Bravo</h2>
        </div>

        <nav>
            <a href="index.html" class="nav-item">
                <i data-lucide="users"></i>
                <span>Люди</span>
            </a>
            <a href="sklad.html" class="nav-item">
                <i data-lucide="package"></i>
                <span>Склад</span>
            </a>
            <a href="tec.html" class="nav-item">
                <i data-lucide="zap"></i>
                <span>ТЕЦ</span>
            </a>
            <a href="vodii.html" class="nav-item active">
                <i data-lucide="car"></i>
                <span>Водії</span>
            </a>
            <a href="masterplan.html" class="nav-item">
                <i data-lucide="calendar-clock"></i>
                <span>Майстер-план</span>
            </a>
            <a href="monitoring.html" class="nav-item">
                <i data-lucide="activity"></i>
                <span>Моніторинг</span>
            </a>
            <a href="admins.html" class="nav-item">
                <i data-lucide="shield"></i>
                <span>Адміни</span>
            </a>
        </nav>
    </aside>

    <main class="main">

        <header class="topbar">
            <div>
                <h1>Водії / Виїзди</h1>
                <p>Тиждень на людину - в кожному дні задаються проміжки зайнятості. Водії - першими в списку.</p>
            </div>
            <div id="authBadge"></div>
        </header>

        <div class="week-nav">
            <button type="button" class="outline-btn" id="prevWeekBtn">‹ Тиждень</button>
            <strong id="weekLabel">—</strong>
            <button type="button" class="outline-btn" id="nextWeekBtn">Тиждень ›</button>
            <button type="button" class="text-btn" id="todayWeekBtn">До сьогодні</button>
        </div>

        <div id="weekBoardContainer">
            <div class="spinner-hint">Завантаження...</div>
        </div>

    </main>

</div>

<script src="js/api.js"></script>
<script src="js/driverWeek.js"></script>
<script>
    initDriverWeekPage(90);
</script>

</body>
</html>
