<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bravo | Люди</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo">
            <span class="logo-dot"></span>
            <h2>Bravo</h2>
        </div>

        <nav>
            <a href="index.html" class="nav-item active">
                <i data-lucide="users"></i>
                <span>Люди</span>
            </a>
            <a href="sklad.html" class="nav-item">
                <i data-lucide="package"></i>
                <span>Склад</span>
            </a>
            <a href="tec.html" class="nav-item">
                <i data-lucide="zap"></i>
                <span>ТЕЦ</span>
            </a>
            <a href="vodii.html" class="nav-item">
                <i data-lucide="car"></i>
                <span>Водії</span>
            </a>
            <a href="masterplan.html" class="nav-item">
                <i data-lucide="calendar-clock"></i>
                <span>Майстер-план</span>
            </a>
            <a href="monitoring.html" class="nav-item">
                <i data-lucide="activity"></i>
                <span>Моніторинг</span>
            </a>
            <a href="admins.html" class="nav-item">
                <i data-lucide="shield"></i>
                <span>Адміни</span>
            </a>
            <a href="logs.html" class="nav-item">
                <i data-lucide="scroll-text"></i>
                <span>Журнал</span>
            </a>
        </nav>
    </aside>

    <main class="main">

        <header class="topbar">
            <div>
                <h1>Люди</h1>
                <p>Хто зараз де - загальний огляд, без входу. Клікніть на людину - календар чергувань і активностей.</p>
            </div>
            <div id="authBadge"></div>
        </header>

        <div class="agenda-legend">
            <span><span class="status-dot on_duty"></span>На чергуванні зараз</span>
            <span><span class="status-dot free"></span>Вільний(а) зараз</span>
            <span>🚗 Водій</span>
        </div>

        <section class="filter-bar">
            <label for="dateInput">Дата</label>
            <input type="date" id="dateInput">
            <label for="atInput">Час</label>
            <input type="time" id="atInput">
            <button type="button" class="outline-btn" id="nowBtn">Зараз</button>
        </section>

        <div id="addPersonWrap"></div>

        <div id="peopleContainer" class="people-list">
            <div class="spinner-hint">Завантаження...</div>
        </div>

    </main>

</div>

<script src="js/api.js"></script>
<script src="js/personModal.js"></script>
<script>
    lucide.createIcons();
    renderAuthBadge(document.getElementById('authBadge'));
    initMobileNav();

    const dateInput = document.getElementById('dateInput');
    const atInput = document.getElementById('atInput');
    const container = document.getElementById('peopleContainer');

    dateInput.value = todayDateStr();
    atInput.value = nowTimeStr();

    document.getElementById('nowBtn').addEventListener('click', () => {
        dateInput.value = todayDateStr();
        atInput.value = nowTimeStr();
        loadPeople();
    });
    dateInput.addEventListener('change', loadPeople);
    atInput.addEventListener('change', loadPeople);

    function personRowHtml(person) {
        const statusText = person.current
            ? `${person.current.service_type} · ${person.current.time_start}–${person.current.time_end}`
            : person.next
                ? `Вільний(а) · далі ${person.next.service_type} о ${person.next.time_start}`
                : 'Вільний(а)';

        const tags = [];
        if (person.is_driver) tags.push('<span class="tag tag--driver">Водій</span>');
        if (person.role === 'lead') tags.push('<span class="tag">Адмін</span>');

        // Кнопки редагування/видалення несуть data-* із поточними значеннями:
        // форма відкривається без додаткового запиту до API.
        const leadBtns = Session.isLead()
            ? `<button type="button" class="person-edit" data-user-id="${person.user_id}" title="Редагувати людину">✎</button>
               <button type="button" class="person-remove" data-user-id="${person.user_id}" title="Видалити з ростеру">×</button>`
            : '';

        return `
            <article class="card person-row" data-user-id="${person.user_id}" data-name="${escapeHtml(person.name)}"
                     data-is-driver="${person.is_driver ? '1' : ''}" data-telegram="${escapeHtml(person.telegram_id || '')}">
                <span class="status-dot ${person.status}"></span>
                <div class="person-info">
                    <strong>${escapeHtml(person.name)}</strong>
                    <span class="person-status">${statusText}</span>
                    <div class="person-tags">${tags.join('')}</div>
                </div>
                ${leadBtns}
                <i data-lucide="chevron-right" class="person-chevron"></i>
            </article>
        `;
    }

    function renderAddPersonForm() {
        const wrap = document.getElementById('addPersonWrap');
        if (!Session.isLead()) {
            wrap.innerHTML = '';
            return;
        }
        wrap.innerHTML = `
            <form class="card add-person-card" id="addPersonForm">
                <input type="text" id="newPersonName" placeholder="Імʼя та прізвище" required minlength="2">
                <label class="checkbox-label"><input type="checkbox" id="newPersonDriver"> Водій</label>
                <button type="submit" class="primary-btn">Додати людину</button>
            </form>
        `;
        document.getElementById('addPersonForm').addEventListener('submit', onAddPerson);
    }

    async function onAddPerson(e) {
        e.preventDefault();
        const nameInput = document.getElementById('newPersonName');
        const driverInput = document.getElementById('newPersonDriver');
        const name = nameInput.value.trim();
        if (name.length < 2) return;

        try {
            await Api.post('/users', { name, is_driver: driverInput.checked });
            nameInput.value = '';
            driverInput.checked = false;
            showBanner(`Додано: ${name}`, 'success');
            await loadPeople();
        } catch (err) {
            showBanner(err.message || 'Не вдалося додати людину');
        }
    }

    async function onRemovePerson(e) {
        e.stopPropagation();
        const userId = e.currentTarget.dataset.userId;
        if (!window.confirm('Видалити цю людину з ростеру? Це не видаляє вже створені зміни.')) return;
        try {
            await Api.del(`/users/${userId}`);
            showBanner('Людину видалено', 'success');
            await loadPeople();
        } catch (err) {
            showBanner(err.message || 'Не вдалося видалити людину');
        }
    }

    /**
     * Редагування людини: імʼя, ознака водія, Telegram. Роль тут навмисно
     * відсутня - вона змінюється лише супер-адміном на сторінці "Адміни", бо
     * тягне за собою видачу/анулювання персонального PIN.
     *
     * stopPropagation обовʼязковий: клік по рядку відкриває модалку календаря,
     * і без нього форма зникала б одразу під нею.
     */
    function onEditPerson(e) {
        e.stopPropagation();
        const row = e.currentTarget.closest('.person-row');
        const userId = row.dataset.userId;

        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.id = 'personEditOverlay';
        overlay.innerHTML = `
            <div class="modal-box modal-box--narrow" role="dialog" aria-modal="true">
                <div class="modal-header">
                    <h2>Редагувати людину</h2>
                    <button type="button" class="modal-close-btn" id="personEditClose">×</button>
                </div>
                <form id="personEditForm" class="stacked-form">
                    <label class="field-label">Імʼя та прізвище
                        <input type="text" id="editName" value="${row.dataset.name}" required minlength="2" maxlength="200">
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="editDriver" ${row.dataset.isDriver ? 'checked' : ''}> Водій
                    </label>
                    <label class="field-label">Telegram
                        <input type="text" id="editTelegram" value="${row.dataset.telegram}" placeholder="@nickname" maxlength="100">
                    </label>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn">Зберегти</button>
                        <button type="button" class="outline-btn" id="personEditCancel">Скасувати</button>
                    </div>
                </form>
            </div>
        `;
        document.body.appendChild(overlay);

        const close = () => overlay.remove();
        document.getElementById('personEditClose').addEventListener('click', close);
        document.getElementById('personEditCancel').addEventListener('click', close);
        overlay.addEventListener('click', (ev) => {
            if (ev.target === overlay) close();
        });

        document.getElementById('personEditForm').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const name = document.getElementById('editName').value.trim();
            if (name.length < 2) {
                showBanner('Імʼя має містити щонайменше 2 символи');
                return;
            }
            try {
                await Api.put(`/users/${userId}`, {
                    name,
                    is_driver: document.getElementById('editDriver').checked,
                    telegram_id: document.getElementById('editTelegram').value.trim(),
                });
                close();
                showBanner('Дані оновлено', 'success');
                await loadPeople();
            } catch (err) {
                showBanner(err.message || 'Не вдалося зберегти зміни');
            }
        });

        document.getElementById('editName').focus();
    }

    let peopleLoaded = false;

    async function loadPeople() {
        hideBanner();
        // Спінер лише на першому завантаженні - інакше кожна зміна дати/часу чи дія
        // (додати/видалити людину) на мить стирала б увесь список ("блимання").
        if (!peopleLoaded) container.innerHTML = '<div class="spinner-hint">Завантаження...</div>';
        try {
            const data = await Api.get(`/people?date=${dateInput.value}&at=${atInput.value}`);
            peopleLoaded = true;
            if (!data.people.length) {
                container.innerHTML = '<div class="empty-state">Ще немає жодної людини в системі.</div>';
                return;
            }
            container.innerHTML = data.people.map(personRowHtml).join('');
            container.querySelectorAll('.person-remove').forEach((btn) => {
                btn.addEventListener('click', onRemovePerson);
            });
            container.querySelectorAll('.person-edit').forEach((btn) => {
                btn.addEventListener('click', onEditPerson);
            });
            container.querySelectorAll('.person-row').forEach((row) => {
                row.addEventListener('click', () => openPersonModal(row.dataset.userId, row.dataset.name));
            });
            lucide.createIcons();
        } catch (err) {
            if (!peopleLoaded) container.innerHTML = '';
            showBanner(err.message || 'Не вдалося завантажити список людей');
        }
    }

    renderAddPersonForm();
    loadPeople();
</script>

</body>
</html>
