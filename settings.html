<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bravo | Налаштування</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-dot"></div>
            <h2>Bravo</h2>
        </div>

        <nav>

            <a href="index.html" class="nav-item">
                <i data-lucide="calendar"></i>
                <span>Мій розклад</span>
            </a>

            <a href="monitoring.html" class="nav-item">
                <i data-lucide="activity"></i>
                <span>Моніторинг</span>
            </a>

            <a href="settings.html" class="nav-item active">
                <i data-lucide="settings"></i>
                <span>Налаштування</span>
            </a>

        </nav>

    </aside>

    <main class="main">

        <div class="topbar">

            <div>
                <h1>Налаштування</h1>
                <p>Керування профілем та застосунком</p>
            </div>

            <div class="profile">

                <img src="https://i.pravatar.cc/100" alt="">

                <div class="profile-info">
                    <strong>Артем</strong>
                    <small>Онлайн</small>
                </div>

                <span class="status online"></span>

            </div>

        </div>

        <div class="settings-grid">

            <div class="card">

                <h3>Профіль</h3>

                <div class="setting-row">
                    <span>Ім'я</span>
                    <strong>Артем</strong>
                </div>

                <div class="setting-row">
                    <span>Email</span>
                    <strong>artem@example.com</strong>
                </div>

                <button class="primary-btn">
                    Редагувати профіль
                </button>

            </div>

            <div class="card">

                <h3>Сповіщення</h3>

                <div class="setting-row">
                    <span>Email</span>
                    <input type="checkbox" checked>
                </div>

                <div class="setting-row">
                    <span>Push</span>
                    <input type="checkbox" checked>
                </div>

                <div class="setting-row">
                    <span>SMS</span>
                    <input type="checkbox">
                </div>

            </div>

            <div class="card">

                <h3>Про застосунок</h3>

                <p>
                    Bravo Dashboard
                </p>

                <p style="margin-top:10px;color:#6B7280;">
                    Версія 1.0
                </p>

            </div>

            <div class="card">

                <h3>Акаунт</h3>

                <button class="outline-btn">
                    Вийти
                </button>

            </div>

        </div>

    </main>

</div>

<script>
lucide.createIcons();
</script>

</body>
</html>
